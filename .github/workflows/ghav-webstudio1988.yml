name: GHAV Webstudio 1988 Storybook core
on:
  push:
    branches:
      - codex/ghav-webstudio1988-*
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design-system:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 36b5c5facbdd75eb1b8ccb2691a08d732a41ded1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 8.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Storybook for design-system
        run: pnpm turbo run storybook:build --filter=@webstudio-is/design-system
      - name: Observe Storybook bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=packages/design-system/storybook-static
          test -s "$bundle/index.html"
          count=$(find "$bundle" -type f | wc -l | tr -d ' ')
          test "$count" -gt 10
          echo "GHAV_BUNDLE_FILE_COUNT=$count"
          find "$bundle" -type f -print0 | xargs -0 shasum -a 256 | LC_ALL=C sort | shasum -a 256 | sed 's/^/GHAV_BUNDLE_TREE_SHA256=/'
  builder:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      DATABASE_URL: postgres://
      AUTH_SECRET: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 36b5c5facbdd75eb1b8ccb2691a08d732a41ded1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 8.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Storybook for builder
        run: pnpm turbo run storybook:build --filter=@webstudio-is/builder
      - name: Observe Storybook bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=apps/builder/storybook-static
          test -s "$bundle/index.html"
          count=$(find "$bundle" -type f | wc -l | tr -d ' ')
          test "$count" -gt 10
          echo "GHAV_BUNDLE_FILE_COUNT=$count"
          find "$bundle" -type f -print0 | xargs -0 shasum -a 256 | LC_ALL=C sort | shasum -a 256 | sed 's/^/GHAV_BUNDLE_TREE_SHA256=/'
